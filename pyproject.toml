[project]
name = "imgprep"
version = "0.1.0"
description = "A command-line toolkit for cleaning and preparing image datasets for computer vision training."
readme = "README.md"
authors = [
    { name = "yosefther", email = "yousefthair9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
imgprep = "imgprep:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
